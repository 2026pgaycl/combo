name: Lint

on:
  push:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Lint PHP files
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . -name '*.php' -print0)
          exit $status
